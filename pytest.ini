[pytest]
# Default unit gate for WhisperFlow (OpenAI-era).
# It must run with NO network, NO localhost server, NO real OpenAI calls, and
# NO real audio hardware. Anything that needs those is marked `integration` or
# `hardware` and deselected here; run them explicitly with `-m integration`
# (after `--override-ini "addopts="`) or `-m hardware`.
testpaths = tests
asyncio_mode = strict
addopts = -m "not integration and not hardware" --timeout=120
markers =
    integration: needs network, a localhost server, or a real OpenAI API call — excluded from the default gate
    hardware: needs real audio hardware / PyAudio devices — excluded from the default gate
